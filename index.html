<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Redefinir Senha - Minha Despensa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f9efe2;
      display: flex;
      justify-content: center;
      align-items: start;
      min-height: 100vh;
      padding: 4rem 1rem;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 10px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      color: #222;
      font-size: 24px;
    }
    .header p {
      color: #666;
      font-size: 14px;
      margin-top: 8px;
    }
    .input-group {
      margin-bottom: 16px;
    }
    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }
    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    .input-group input:focus {
      border-color: #ab7a5e;
      outline: none;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #ab7a5e;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover { background: #8a634b; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 14px;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    .hidden { display: none; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #757678;
      font-size: 14px;
      text-decoration: none;
    }
    .back-link:hover { color: #ab7a5e; }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .info-box {
      background: #e8f4fd;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #0c5460;
      word-break: break-all;
    }
    /* Estilo para o botão desabilitado após sucesso */
    .btn-success {
      background: #28a745 !important;
      cursor: default !important;
    }
    .btn-success:hover {
      background: #28a745 !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔑 Redefinir Senha</h1>
      <p>Digite sua nova senha para continuar</p>
    </div>

    <div id="tokenInfo" class="info-box hidden"></div>
    <div id="message" class="message hidden"></div>

    <form id="resetForm">
      <div class="input-group">
        <label for="password">Nova Senha</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Mínimo 6 caracteres"
          required
          minlength="6"
          autocomplete="new-password"
        />
      </div>
      <div class="input-group">
        <label for="confirmPassword">Confirmar Senha</label>
        <input 
          type="password" 
          id="confirmPassword" 
          placeholder="Digite novamente"
          required
          minlength="6"
          autocomplete="new-password"
        />
      </div>
      <button type="submit" class="btn" id="submitBtn">
        Redefinir Senha
      </button>
    </form>

    <!-- <a href="#" class="back-link" onclick="window.history.back()">← Voltar</a> -->
  </div>

  <script>
    // 🔹 CONFIGURAÇÃO
    const SUPABASE_URL = 'https://ksgwjngawlppaoarzuob.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_aEwUdVLlYG87yCdZSuV9ZQ_9XUlIZrl';

    const form = document.getElementById('resetForm');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');
    const tokenInfoDiv = document.getElementById('tokenInfo');
    let resetToken = '';

    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
      messageDiv.classList.remove('hidden');
    }

    function hideMessage() {
      messageDiv.classList.add('hidden');
    }

    // 🔹 FUNÇÃO PARA RESTAURAR O BOTÃO AO ESTADO NORMAL
    function resetButtonState() {
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Redefinir Senha';
      submitBtn.className = 'btn';
    }

    // 🔹 FUNÇÃO PARA DESABILITAR O BOTÃO PERMANENTEMENTE (APÓS SUCESSO)
    function disableButtonPermanently() {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '✅ Senha redefinida!';
      submitBtn.className = 'btn btn-success';
    }

    // Lê o token do formato de URL usado pelo Supabase.
    function getTokenFromUrl() {
      const params = new URLSearchParams(window.location.search);
      let token = params.get('access_token') || params.get('token');

      if (!token && window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        token = hashParams.get('access_token') || hashParams.get('token');
      }

      return token;
    }

    function clearAuthDataFromUrl() {
      const cleanUrl = `${window.location.origin}${window.location.pathname}`;
      window.history.replaceState({}, document.title, cleanUrl);
    }

    // 🔹 INICIALIZAÇÃO
    document.addEventListener('DOMContentLoaded', async () => {
      const token = getTokenFromUrl();

      if (!token) {
        showMessage('⚠️ Link inválido ou expirado. Solicite um novo link de redefinição.', 'error');
        submitBtn.disabled = true;
        tokenInfoDiv.textContent = '❌ Link de redefinição inválido ou expirado';
        tokenInfoDiv.classList.remove('hidden');
      } else {
        clearAuthDataFromUrl();
        tokenInfoDiv.textContent = '🔑 Link válido. Escolha uma nova senha.';
        tokenInfoDiv.classList.remove('hidden');
        showMessage('✅ Link válido! Digite sua nova senha.', 'info');
      }

      resetToken = token || '';
    });

    // 🔹 REDEFINIR SENHA
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessage();

      const password = passwordInput.value;
      const confirm = confirmInput.value;

      if (password.length < 6) {
        return showMessage('A senha deve ter pelo menos 6 caracteres.', 'error');
      }

      if (password !== confirm) {
        return showMessage('As senhas não conferem.', 'error');
      }

      // Desabilita o botão e mostra loading
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Atualizando...';

      try {
        const token = resetToken;
        
        if (!token) {
          throw new Error('Token de redefinição não encontrado.');
        }

        // 🔹 CHAMA A API DO SUPABASE PARA ATUALIZAR A SENHA
        const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            password: password
          })
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(result.message || result.error?.message || 'Erro ao redefinir senha.');
        }

        // ✅ SUCESSO: desabilita permanentemente o botão e mostra mensagem de sucesso
        disableButtonPermanently();
        
        // Limpa os campos de senha por segurança
        passwordInput.value = '';
        confirmInput.value = '';
        
        showMessage('✅ Senha redefinida com sucesso! Você pode retornar ao APP e fazer o login', 'success');

        // Redireciona após 3 segundos
        setTimeout(() => {
          window.location.href = 'minhadispensa://login';
        }, 3000);

      } catch (error) {
        showMessage(error.message || 'Erro ao redefinir senha. Tente novamente.', 'error');
        
        // Restaura o botão apenas em caso de erro
        resetButtonState();
      }
    });

  </script>
</body>
</html>
