<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha - Minha Despensa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f9efe2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      color: #222;
      font-size: 24px;
    }
    .header p {
      color: #666;
      font-size: 14px;
      margin-top: 8px;
    }
    .input-group {
      margin-bottom: 16px;
    }
    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }
    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    .input-group input:focus {
      border-color: #ab7a5e;
      outline: none;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #ab7a5e;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover { background: #8a634b; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 14px;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    .hidden { display: none; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #757678;
      font-size: 14px;
      text-decoration: none;
    }
    .back-link:hover { color: #ab7a5e; }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .info-box {
      background: #e8f4fd;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #0c5460;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔑 Redefinir Senha</h1>
      <p>Digite sua nova senha para continuar</p>
    </div>

    <!-- 🔹 MOSTRA O TOKEN (SÓ PARA DEBUG) -->
    <div id="tokenInfo" class="info-box hidden"></div>

    <div id="message" class="message hidden"></div>

    <form id="resetForm">
      <div class="input-group">
        <label for="password">Nova Senha</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Mínimo 6 caracteres"
          required
          minlength="6"
        />
      </div>
      <div class="input-group">
        <label for="confirmPassword">Confirmar Senha</label>
        <input 
          type="password" 
          id="confirmPassword" 
          placeholder="Digite novamente"
          required
          minlength="6"
        />
      </div>
      <button type="submit" class="btn" id="submitBtn">
        Redefinir Senha
      </button>
    </form>

    <a href="#" class="back-link" onclick="window.history.back()">← Voltar</a>
  </div>

  <script>
    // 🔹 CONFIGURAÇÃO
    const SUPABASE_URL = 'https://ksgwjngawlppaoarzuob.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_aEwUdVLlYG87yCdZSuV9ZQ_9XUlIZrl';

    const form = document.getElementById('resetForm');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');
    const tokenInfoDiv = document.getElementById('tokenInfo');

    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
      messageDiv.classList.remove('hidden');
    }

    function hideMessage() {
      messageDiv.classList.add('hidden');
    }

    // 🔹 PEGA O TOKEN DA URL
    function getTokenFromUrl() {
      const params = new URLSearchParams(window.location.search);
      // O token pode vir como access_token ou token
      const token = params.get('access_token') || params.get('token');
      console.log('🔑 Token encontrado:', token ? token.substring(0, 20) + '...' : 'NENHUM');
      return token;
    }

    // 🔹 PEGA O EMAIL DO USUÁRIO (SE DISPONÍVEL)
    function getEmailFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('email') || 'Usuário';
    }

    // 🔹 INICIALIZAÇÃO - MOSTRA INFORMAÇÕES
    document.addEventListener('DOMContentLoaded', async () => {
      const token = getTokenFromUrl();
      const email = getEmailFromUrl();
      
      if (!token) {
        showMessage('⚠️ Link inválido ou expirado. Solicite um novo link de redefinição.', 'error');
        submitBtn.disabled = true;
        tokenInfoDiv.textContent = '❌ Nenhum token encontrado na URL';
        tokenInfoDiv.classList.remove('hidden');
      } else {
        // Mostra o token (parcial) para debug
        tokenInfoDiv.textContent = `🔑 Token: ${token.substring(0, 15)}... (para ${email || 'usuário'})`;
        tokenInfoDiv.classList.remove('hidden');
        showMessage('✅ Link válido! Digite sua nova senha.', 'info');
        
        // 🔹 TENTA OBTER O EMAIL DO USUÁRIO VIA API
        try {
          const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
            headers: {
              'Authorization': `Bearer ${token}`,
              'apikey': SUPABASE_ANON_KEY
            }
          });
          
          if (response.ok) {
            const userData = await response.json();
            console.log('👤 Usuário autenticado:', userData.email);
            tokenInfoDiv.textContent = `👤 Redefinindo senha para: ${userData.email}`;
          }
        } catch (error) {
          console.log('Não foi possível buscar dados do usuário:', error);
        }
      }
    });

    // 🔹 REDEFINIR SENHA
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessage();

      const password = passwordInput.value;
      const confirm = confirmInput.value;

      if (password.length < 6) {
        return showMessage('A senha deve ter pelo menos 6 caracteres.', 'error');
      }

      if (password !== confirm) {
        return showMessage('As senhas não conferem.', 'error');
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Atualizando...';

      try {
        const token = getTokenFromUrl();
        
        if (!token) {
          throw new Error('Token de redefinição não encontrado.');
        }

        console.log('🔄 Atualizando senha via API REST...');
        console.log('🔑 Token usado:', token.substring(0, 20) + '...');

        // 🔹 CHAMA A API DO SUPABASE PARA ATUALIZAR A SENHA
        const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            password: password
          })
        });

        const result = await response.json();

        if (!response.ok) {
          console.error('❌ Erro da API:', result);
          throw new Error(result.message || result.error?.message || 'Erro ao redefinir senha.');
        }

        console.log('✅ Senha atualizada com sucesso!', result);

        showMessage('✅ Senha redefinida com sucesso!', 'success');

        // Redireciona após 3 segundos
        setTimeout(() => {
          window.location.href = 'minhadispensa://login';
        }, 3000);

      } catch (error) {
        console.error('❌ Erro:', error);
        showMessage(error.message || 'Erro ao redefinir senha. Tente novamente.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Redefinir Senha';
      }
    });

    console.log('📄 Página de reset carregada');
    console.log('🔗 URL atual:', window.location.href);
    console.log('🔑 Token na URL:', getTokenFromUrl() ? '✅ Presente' : '❌ Ausente');
  </script>
</body>
</html>
